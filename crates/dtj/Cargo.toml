[package]
name = "dtj"
version = "0.1.1"
edition = "2021"
description = "DTJ v1 reference core — Debug Trace Journal byte format"
license = "MIT OR Apache-2.0"

[lib]
name = "dtj"
path = "src/lib.rs"

[[bin]]
name = "dtj"
path = "src/bin/dtj.rs"

[[bin]]
name = "dtj-agent"
path = "src/bin/dtj-agent.rs"

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

[dependencies.pyo3]
version = "0.22"
features = ["extension-module"]

[dev-dependencies]
tempfile = "3"