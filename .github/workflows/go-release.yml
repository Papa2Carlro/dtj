name: Release Go Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: packages/dtj-go/go.sum

      - name: Go mod tidy
        run: cd packages/dtj-go && go mod tidy

      - name: Verify go.sum
        run: cd packages/dtj-go && git diff --exit-code go.sum

      - name: Run tests
        run: cd packages/dtj-go && go test ./...

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/dtj-go/*.go
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
