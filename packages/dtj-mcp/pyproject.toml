[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtj-mcp"
version = "1.0.0"
description = "DTJ MCP server + CLI — unified read/write tools for Debug Trace Journal"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "starlette>=0.27.0",
    "uvicorn[standard]>=0.23.0",
]

[project.scripts]
dtj = "debug_trace_mcp.cli:main"
dtj-mcp = "debug_trace_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src/"]
